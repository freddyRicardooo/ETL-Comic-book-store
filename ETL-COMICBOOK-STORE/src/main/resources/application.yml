spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: jobImportacao
      enabled: true

importacao:
  diretorio: ${IMPORTACAO_DIRETORIO:C:/Arquivo Comic Book}

logging:
  level:
    root: INFO
    com.br.estudos: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [exec=%X{jobExecutionId}] %logger{20} - %msg%n"