spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      open-in-view: false
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: jobImportacao
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.br.estudos: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [exec=%X{jobExecutionId}] %logger{20} - %msg%n"